<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Tweet Room{% endblock %}</title>
    <!-- Add any external stylesheets here -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-blue-100">
    {% block content %}
    <div class="flex items-center justify-center min-h-screen bg-blue-100">
        <div class="max-w-lg w-full bg-white rounded-lg shadow-2xl p-8 border-4 border-indigo-600">
            <h1 class="text-4xl font-bold text-center text-indigo-800 mb-6">Tweet Room</h1>
            <form method="POST" class="space-y-8">
                {% csrf_token %}
                <div>
                    <label for="prompt" class="block text-xl font-medium text-gray-800 mb-2">Enter your prompt:</label>
                    <textarea id="prompt" name="prompt" rows="6" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition duration-200" placeholder="Type your thoughts here..." required>{{ request.POST.prompt }}</textarea>
                </div>
                <div class="flex justify-center">
                    <button type="submit" class="px-8 py-3 bg-indigo-600 text-white font-semibold rounded-md hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-600 focus:ring-offset-2 transition duration-300">Send</button>
                </div>
            </form>
            {% if Answer %}
            <div class="mt-8 p-6 bg-indigo-50 border border-indigo-200 rounded-lg shadow-lg">
                <h3 class="text-2xl font-medium text-indigo-600">Answer:</h3>
                <p class="mt-2 text-gray-800">{{ Answer }}</p>
            </div>
            {% endif %}
        </div>
    </div>
    {% endblock %}
</body>

</html>
